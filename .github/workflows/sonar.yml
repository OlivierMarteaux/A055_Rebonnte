name: SonarQube

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar:
    name: Run jacocoTestReport and Sonar
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Restore google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: resizable
          target: google_apis
          cores: 6
          ram-size: 4096M
          heap-size: 228M
          disk-size: 6G
          force-avd-creation: false
          enable-hw-keyboard: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator: true

      - name: run instrumented tests
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: resizable
          target: google_apis
          cores: 6
          ram-size: 4096M
          heap-size: 228M
          disk-size: 6G
          force-avd-creation: false
          enable-hw-keyboard: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew sonar --info || true
            adb logcat -d > logcat.txt

      # Step 1 — Dump Logcat to a file after tests
#      - name: Dump logcat to file
#        run: adb logcat -d > logcat.txt

      # Step 2 — Upload Logcat as a CI artifact
      - name: Upload Logcat artifact
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: logcat.txt
          overwrite: true